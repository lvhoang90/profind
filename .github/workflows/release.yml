name: Release
# Tạo GitHub Release từ RELEASE_NOTES.md. Hai cách chạy:
#  1) Đẩy tag dạng v* (ví dụ v1.0.0);
#  2) Actions > Release > Run workflow, nhập tên tag (tag được tạo trên nhánh đang chạy). Tag có dấu "-" là pre-release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tên tag, ví dụ v1.0.0"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tạo release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          flag=""
          case "$TAG" in *-*) flag="--prerelease";; esac
          gh release create "$TAG" $flag --target "${{ github.sha }}" --title "ProFind ${TAG#v}" --notes-file RELEASE_NOTES.md
