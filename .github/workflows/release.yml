name: Release
# Đẩy tag dạng v* (ví dụ v0.1.0-beta.1) thì tự tạo GitHub Release từ RELEASE_NOTES.md; tag có dấu "-" được đánh dấu là bản tiền phát hành (pre-release).
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tạo release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flag=""
          case "$TAG" in *-*) flag="--prerelease";; esac
          gh release create "$TAG" $flag --title "ProFind ${TAG#v}" --notes-file RELEASE_NOTES.md
