<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#050a18;font-family:Inter,"Inter Display",sans-serif;color:var(--fg);--fg:#e8eeff;--mut:#8ea0cf;--card:rgba(14,22,48,.86);--cardb:rgba(120,160,255,.28)}
#bg,#fx{position:absolute;inset:0}
.abs{position:absolute}
#cam{position:absolute;inset:0;transform-origin:50% 45%}
.top{left:60px;top:64px;display:flex;align-items:center;gap:18px;font:800 46px Inter;letter-spacing:-1px}
.top img{width:66px;height:66px}
.prem{right:60px;top:72px;font:800 28px Inter;letter-spacing:4px;color:#1a1100;background:linear-gradient(90deg,#fde68a,#f59e0b);padding:12px 26px;border-radius:99px;box-shadow:0 0 40px rgba(245,158,11,.5)}
.gold{background:linear-gradient(90deg,var(--g1,#fde68a),var(--g2,#fbbf24) 45%,var(--g3,#f59e0b));-webkit-background-clip:text;color:transparent}
.card{background:var(--card);border:1.5px solid var(--cardb);border-radius:38px;box-shadow:0 30px 90px rgba(0,0,0,.45)}
.mut{color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:10px;padding:12px 26px;border-radius:99px;font:700 34px Inter;white-space:nowrap}
.foot{left:60px;right:60px;bottom:44px;text-align:center;font:500 26px Inter;color:var(--mut)}
.h{font:800 112px/1.05 Inter;letter-spacing:-3px;text-align:center;left:60px;right:60px}
.mono{font-feature-settings:"tnum";font-variant-numeric:tabular-nums}
</style></head><body>
<canvas id="bg" width="1080" height="1920"></canvas><canvas id="fx" width="1080" height="1920"></canvas>
<div id="cam"><div class="abs top" id="top"><img src="ami-logo.svg"><span>Ami</span></div><div class="abs prem" id="prem">★ PREMIUM</div><div id="sc"></div></div>
<div class="abs foot" id="foot">Dữ liệu và tên trong clip chỉ để minh họa</div>
<script id="tl" type="application/json">__TL__</script>
<script id="qrsvg" type="text/plain">__QR__</script>
<script>
const TL=JSON.parse(document.getElementById("tl").textContent).scenes, QR=document.getElementById("qrsvg").textContent;
const ST=TL.map(s=>s.start);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),seg=(t,a,b)=>clamp((t-a)/(b-a)),ease=x=>1-Math.pow(1-clamp(x),3),back=x=>{x=clamp(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const bounce=x=>{x=clamp(x);const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375};
const rnd=(i,k=1)=>((Math.sin(i*127.1*k+311.7)*43758.5453)%1+1)%1;
const typed=(s,p)=>s.slice(0,Math.floor(s.length*clamp(p)));
const rise=(u,a,d=50)=>{const p=ease(seg(u,a,a+.6));return `opacity:${p};transform:translateY(${(1-p)*d}px)`};
const pop=(u,a)=>{const p=back(seg(u,a,a+.5));return `opacity:${clamp(seg(u,a,a+.15))};transform:scale(${.5+.5*p})`};
const mix=(a,b,k)=>a.map((x,i)=>Math.round(x+(b[i]-x)*k)), rgb=c=>`rgb(${c.join()})`;
// ---- chủ đề màu: lạnh → ấm → sáng
const W=t=>ease(seg(t,10.6,20)), L=t=>ease(seg(t,42,43.6));
function theme(t){const l=L(t);const f=mix([232,238,255],[40,28,18],l),m=mix([142,160,207],[120,92,62],l);
 document.body.style.setProperty("--fg",rgb(f));{const g1=mix([253,230,138],[180,83,9],l),g2=mix([251,191,36],[217,119,6],l),g3=mix([245,158,11],[146,64,14],l);const b=document.body.style;b.setProperty("--g1",rgb(g1));b.setProperty("--g2",rgb(g2));b.setProperty("--g3",rgb(g3))}document.body.style.setProperty("--mut",rgb(m));
 document.body.style.setProperty("--card",l>.5?"rgba(255,255,255,.88)":(W(t)>.5?"rgba(34,22,12,.86)":"rgba(14,22,48,.86)"));
 document.body.style.setProperty("--cardb",l>.5?"rgba(217,119,6,.35)":(W(t)>.5?"rgba(251,191,36,.3)":"rgba(120,160,255,.28)"))}
const bg=document.getElementById("bg").getContext("2d"),fx=document.getElementById("fx").getContext("2d");
function drawBg(t){const w=W(t),l=L(t);
 const top=mix(mix([6,12,34],[34,22,10],w),[255,243,220],l),bot=mix(mix([3,6,15],[10,7,5],w),[255,224,170],l);
 let g=bg.createLinearGradient(0,0,0,1920);g.addColorStop(0,rgb(top));g.addColorStop(1,rgb(bot));bg.fillStyle=g;bg.fillRect(0,0,1080,1920);
 // đèn bàn / nắng
 const lampA=(t<10?.16:0)+(w*(1-l))*.28+l*.35, lc=t<10?"110,150,255":"253,200,90";
 const r0=bg.createRadialGradient(880,260,40,880,260,1100);r0.addColorStop(0,`rgba(${lc},${lampA})`);r0.addColorStop(1,`rgba(${lc},0)`);bg.fillStyle=r0;bg.fillRect(0,0,1080,1920);
 // nhịp tim: vignette đập
 let beat=0;if(t<10){const bpm=t<5?58:58+(t-5)*9;beat=Math.exp(-(((t*bpm/60)%1)*7))*(t<5?.28:.45)}
 const v=bg.createRadialGradient(540,1000,200,540,1000,1150);v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,`rgba(${t<10?"40,0,10":"0,0,0"},${(.66*(1-l)+.1*l)+beat})`);bg.fillStyle=v;bg.fillRect(0,0,1080,1920)}
function drawFx(t){fx.clearRect(0,0,1080,1920);const w=W(t),l=L(t);
 const amt=t<10?.35:(.7+.3*w);
 for(let i=0;i<60;i++){const sp=.22+rnd(i,2)*.5,y=1920-((t*sp*60+rnd(i,3)*1920)%1920),x=rnd(i)*1080+Math.sin(t*.7+i)*30,a=(.12+.45*rnd(i,4))*amt*Math.min(1,y/300,(1920-y)/300);
  fx.fillStyle=t<10?`rgba(150,185,255,${a})`:(l>.5?`rgba(245,158,11,${a})`:`rgba(253,224,130,${a})`);fx.beginPath();fx.arc(x,y,1.5+rnd(i,5)*3.5,0,6.283);fx.fill()}
 // tia nắng ở cảnh 8
 if(t>42&&t<48.2){const u=t-42,a=ease(seg(u,.5,1.6))*.5*(1-seg(u,5.2,6.2));fx.save();fx.translate(540,640);fx.globalCompositeOperation="lighter";
  for(let k=0;k<14;k++){const an=k/14*6.283+u*.12,wd=.07;fx.fillStyle=`rgba(255,214,120,${a*.35})`;fx.beginPath();fx.moveTo(0,0);fx.arc(0,0,1500,an,an+wd);fx.closePath();fx.fill()}fx.restore()}
 // pháo giấy ở cảnh cuối
 if(t>57.2){const u=t-57.2;for(let i=0;i<70;i++){const x=540+(rnd(i,6)-.5)*160+Math.cos(rnd(i,7)*6.283)*u*(200+rnd(i,8)*500),y=1000+Math.sin(rnd(i,7)*6.283)*u*(200+rnd(i,8)*500)+u*u*380;
  fx.save();fx.translate(x,y);fx.rotate(u*(2+rnd(i,9)*6));fx.fillStyle=["#f59e0b","#fbbf24","#fb7185","#38bdf8","#34d399"][i%5];fx.globalAlpha=Math.max(0,1-u/2.6);fx.fillRect(-7,-4,14,8);fx.restore()}}}
// ---- thành phần dùng chung
const lines=(n,seed,wmax)=>Array.from({length:n},(_,i)=>`<div style="height:14px;border-radius:7px;margin:0 0 16px;width:${wmax*(.55+.45*rnd(i+seed))}px;background:#cfd6ea"></div>`).join("");
const judge=(x,y,s,c)=>`<svg class="abs" style="left:${x}px;top:${y}px" width="${160*s}" height="${200*s}" viewBox="0 0 160 200"><circle cx="80" cy="56" r="40" fill="${c}"/><path d="M8 200c0-62 30-92 72-92s72 30 72 92z" fill="${c}"/></svg>`;
const docIcon=(s,rot=0)=>`<svg width="${s}" height="${s*1.25}" viewBox="0 0 80 100" style="transform:rotate(${rot}deg)"><path d="M6 6h48l20 20v68H6z" fill="#2b6cdf"/><path d="M54 6v20h20z" fill="#9dc0ff"/><text x="40" y="76" text-anchor="middle" font-family="Inter" font-weight="800" font-size="34" fill="#fff">W</text></svg>`;
const check=(s)=>`<svg width="${s}" height="${s}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#22c55e"/><path d="M28 52l16 16 30-34" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

// ---- 1. 0–5  hai giờ sáng
function s0(u){const push=u*.014;
 const cur=Math.floor(u*2)%2?1:0;
 return `<div class="abs" style="left:0;right:0;top:130px;text-align:center;font:800 170px Inter;letter-spacing:-4px;color:#7fa6ff;opacity:${ease(seg(u,0,.8))};text-shadow:0 0 60px rgba(100,150,255,.55);font-variant-numeric:tabular-nums">02<span style="opacity:${Math.floor(u*2)%2?.25:1}">:</span>47</div>
 <div class="abs" style="left:0;right:0;top:340px;text-align:center;font:700 34px Inter;letter-spacing:8px;color:#6f88c8;${rise(u,.8,20)}">ĐÊM TRƯỚC NGÀY BẢO VỆ</div>
 <div class="abs card" style="left:110px;top:520px;width:860px;height:1050px;padding:50px 56px;background:rgba(236,242,255,.95);border-color:rgba(130,170,255,.5);box-shadow:0 0 120px rgba(100,150,255,.28),0 40px 110px rgba(0,0,0,.6);${rise(u,.3,90)}">
  <div style="display:flex;gap:12px;margin-bottom:40px">${["#ef4444","#fbbf24","#22c55e"].map(c=>`<i style="width:18px;height:18px;border-radius:9px;background:${c}"></i>`).join("")}<span style="margin-left:auto;font:600 26px Inter;color:#7c86a8">luan-an-tien-si.docx</span></div>
  <div style="font:800 56px/1.1 Inter;color:#0f1a3c;letter-spacing:-1px;margin-bottom:34px">LUẬN ÁN TIẾN SĨ</div>
  ${lines(11,3,740)}<div style="height:34px"></div>${lines(6,30,740)}
  <div style="display:flex;align-items:center;gap:6px;margin-top:6px"><div style="height:14px;width:${300*seg(u,1,3.6)}px;border-radius:7px;background:#cfd6ea"></div><i style="width:4px;height:44px;background:#2563eb;opacity:${cur}"></i></div>
  <div style="position:absolute;right:56px;bottom:40px;font:700 32px Inter;color:#7c86a8">Trang 187 / 187</div></div>
 <div class="abs" style="left:0;right:0;top:1640px;text-align:center;font:600 38px Inter;color:#6f88c8;opacity:${ease(seg(u,2.2,3.2))}">Sáng mai, hội đồng đang đợi.</div>`}
// ---- 2. 5–10  hội đồng và câu hỏi
function s1(u){const fall=bounce(seg(u,.5,1.5)),y=-340+(400+340)*fall;
 const chairs=Array.from({length:5},(_,i)=>judge(40+i*196,860+(i%2?14:0),1.15,"#1c2b63")).join("");
 const rim=Array.from({length:5},(_,i)=>`<div class="abs" style="left:${40+i*196}px;top:${852+(i%2?14:0)}px;width:184px;height:6px;border-radius:3px;background:rgba(120,160,255,${.2+.25*seg(u,0,1)})"></div>`).join("");
 const shake=u>1.5&&u<2.0?(Math.sin(u*90)*10*(2.0-u)/.5):0;
 return `<div class="abs" style="left:0;right:0;top:0;bottom:0;opacity:${ease(seg(u,0,.7))}">${chairs}${rim}<div class="abs" style="left:0;right:0;top:1100px;height:340px;background:linear-gradient(180deg,#14214f,rgba(5,10,24,0));border-top:3px solid rgba(120,160,255,.3)"></div></div>
 <div class="abs" style="left:90px;width:900px;top:${y+shake}px;padding:56px 60px;border-radius:44px;background:linear-gradient(160deg,#1a1230,#0c1028);border:2px solid rgba(248,113,113,${.4+.4*seg(u,1.4,1.7)});box-shadow:0 0 ${40+90*seg(u,1.4,1.8)}px rgba(248,113,113,.38),0 40px 100px rgba(0,0,0,.7)">
  <div style="font:700 30px Inter;letter-spacing:6px;color:#f87171;margin-bottom:22px">CÂU HỎI TỪ HỘI ĐỒNG</div>
  <div style="font:800 92px/1.08 Inter;letter-spacing:-2px;color:#f1f5ff">Số liệu này lấy từ đâu?</div></div>
 <div class="abs" style="left:0;right:0;top:1500px;text-align:center;font:700 46px Inter;color:#fca5a5;opacity:${ease(seg(u,2.6,3.6))*(.6+.4*Math.sin(u*9))}">Bạn chưa nghĩ tới câu này…</div>`}
// ---- 3. 10–14  nếu được bảo vệ thử
function s2(u){const jit=(1-ease(seg(u,0,2.1)))*14,j=(i)=>`transform:translate(${(rnd(i+Math.floor(u*24))-.5)*jit}px,${(rnd(i+9+Math.floor(u*24))-.5)*jit}px)`;
 const bloom=ease(seg(u,2.0,3.4)),logo=back(seg(u,2.1,2.8));
 return `<div class="abs" style="left:0;right:0;top:0;bottom:0;background:#000;opacity:${.92*(1-ease(seg(u,3.2,4)))}"></div>
 <div class="abs h" style="top:430px;font-size:120px;opacity:${ease(seg(u,.2,.9))}"><div style="${j(1)}">Nếu được</div><div class="gold" style="${j(2)};display:block">bảo vệ thử</div><div style="${j(3)}">trước một lần?</div></div>
 <div class="abs" style="left:540px;top:1330px;width:0;height:0"><div style="position:absolute;left:-${500*bloom}px;top:-${500*bloom}px;width:${1000*bloom}px;height:${1000*bloom}px;border-radius:50%;background:radial-gradient(circle,rgba(253,224,130,.75),rgba(245,158,11,.18) 45%,rgba(245,158,11,0) 70%)"></div>
  ${[0,1].map(k=>{const p=seg(u,2.2+k*.3,3.6+k*.3);return `<div style="position:absolute;left:${-300*p}px;top:${-300*p}px;width:${600*p}px;height:${600*p}px;border-radius:50%;border:4px solid rgba(253,224,130,${(1-p)*.8})"></div>`}).join("")}
  <img src="ami-logo.svg" style="position:absolute;left:-150px;top:-150px;width:300px;height:300px;transform:scale(${logo});opacity:${clamp(seg(u,2.0,2.4))};filter:drop-shadow(0 0 50px rgba(253,224,130,.9))"></div>`}
// ---- 4. 14–20  tia quét bản thảo
const COM=[["Mục tiêu chưa rõ","#f59e0b",.45,-20],["Thiếu nguồn trích","#ef4444",.9,640],["Lập luận tốt","#22c55e",1.35,-30],["Cỡ mẫu chưa nêu","#ef4444",1.85,650],["Cần thêm số liệu","#f59e0b",2.4,-20],["Kết luận rõ ràng","#22c55e",2.9,640]];
function s3(u){const bt=seg(u,.5,4.0),by=560+780*bt;
 const N=18,ls=Array.from({length:N},(_,i)=>{const y=640+i*38,lit=by>y;return `<div class="abs" style="left:300px;top:${y}px;width:${300*(.5+.5*rnd(i+4))+160}px;height:14px;border-radius:7px;background:${lit?"linear-gradient(90deg,#fbbf24,#fde68a)":"#cfd6ea"};box-shadow:${lit?"0 0 18px rgba(251,191,36,.7)":"none"}"></div>`}).join("");
 const cm=COM.map(([tx,c,a,x],i)=>{const y=700+i*118+(i%2?20:0);return `<div class="abs card" style="left:${x+(x<0?40:0)}px;top:${y}px;padding:16px 26px 16px 22px;border-radius:26px;display:flex;align-items:center;gap:14px;font:700 34px Inter;${by>y?pop(u,a):"opacity:0"}"><i style="width:18px;height:18px;border-radius:9px;background:${c};box-shadow:0 0 16px ${c}"></i>${tx}</div>`}).join("");
 return `<div class="abs" style="left:0;right:0;top:170px;text-align:center;${rise(u,.1,30)}"><span class="gold" style="font:800 78px Inter;letter-spacing:-2px">Giáo sư phản biện</span></div>
 <div class="abs" style="left:250px;top:${520+ (1-ease(seg(u,0,.8)))*-700}px;width:580px;height:900px;border-radius:22px;background:linear-gradient(160deg,#faf7ff,#e4def5);box-shadow:0 40px 100px rgba(0,0,0,.6);transform:rotate(${(1-ease(seg(u,0,.8)))*-14}deg)"></div>
 <div class="abs" style="left:300px;top:575px;font:800 36px Inter;color:#1a2146;opacity:${ease(seg(u,.5,1))}">CHƯƠNG 3. PHƯƠNG PHÁP</div>${ls}
 <div class="abs" style="left:230px;width:620px;top:${by}px;height:8px;border-radius:4px;background:#fde68a;box-shadow:0 0 50px 20px rgba(253,224,130,.75);opacity:${bt>0&&bt<1?1:0}"></div>
 ${cm}`}
// ---- 5. 20–27  trích dẫn nguyên văn được đối chiếu
function s4(u){const hl=ease(seg(u,.9,2.0)),conn=seg(u,2.0,3.0),ok=back(seg(u,3.0,3.6)),flash=Math.exp(-Math.max(0,u-3.0)*6)*(u>3?1:0);
 const q="mẫu gồm 120 giáo viên được chọn theo phương pháp thuận tiện";
 return `<div class="abs" style="left:0;right:0;top:170px;text-align:center;font:800 62px Inter;${rise(u,0,30)}">Nhận xét <span class="gold">có bằng chứng</span></div>
 <div class="abs card" style="left:70px;top:330px;width:940px;padding:44px 50px;${rise(u,.2,60)}">
  <div style="display:flex;align-items:center;gap:14px;font:700 32px Inter;margin-bottom:22px"><i style="width:18px;height:18px;border-radius:9px;background:#ef4444"></i>Phương pháp: chưa nêu lý do chọn mẫu</div>
  <div style="font:500 46px/1.4 Inter">“…<span style="background:linear-gradient(90deg,rgba(251,191,36,.9) ${hl*100}%,rgba(251,191,36,0) ${hl*100}%);padding:2px 4px;border-radius:6px;color:#1a1100">${q}</span>…”</div></div>
 <svg class="abs" style="left:0;top:0" width="1080" height="1920"><path d="M300 700 C 140 900, 140 1000, 300 1120" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" stroke-dasharray="620" stroke-dashoffset="${620*(1-conn)}" style="filter:drop-shadow(0 0 12px #fbbf24)"/></svg>
 <div class="abs" style="left:150px;top:1050px;width:780px;height:560px;border-radius:26px;background:linear-gradient(160deg,#faf7ff,#e4def5);padding:44px 52px;color:#1a2146;box-shadow:0 30px 90px rgba(0,0,0,.5),0 0 ${80*flash}px rgba(34,197,94,${.8*flash});${rise(u,1.4,60)}">
  <div style="font:700 28px Inter;color:#7c86a8;margin-bottom:24px;letter-spacing:3px">BẢN GỐC · TRANG 84</div>${lines(3,60,680)}
  <div style="font:500 38px/1.45 Inter;margin:10px 0 18px">Đối tượng khảo sát: <span style="background:rgba(251,191,36,.9);padding:2px 4px;border-radius:6px;color:#1a1100;opacity:${conn>.9?1:.35}">${q}</span> tại ba trường.</div>${lines(3,70,680)}</div>
 <div class="abs" style="left:540px;top:1560px;width:0;height:0;transform:scale(${ok});opacity:${clamp(seg(u,3.0,3.2))}"><div style="position:absolute;left:-250px;top:-52px;width:500px;display:flex;align-items:center;gap:16px;padding:14px 30px 14px 18px;border-radius:99px;background:#16a34a;color:#fff;font:800 42px Inter;box-shadow:0 0 60px rgba(34,197,94,.6)">${check(60)}Khớp nguyên văn</div></div>`}
// ---- 6. 27–34  điểm và kết luận
const CR=[["Tính cấp thiết",14,20],["Tổng quan",15,20],["Phương pháp",10,20],["Kết quả",17,20],["Kết luận",15,20]];
function s5(u){let acc=0,cum=0;const rows=CR.map(([n,v,m],i)=>{const a=.4+i*.55,p=ease(seg(u,a,a+.5));cum+=v*p;const flag=i==2&&u>3.7;
  return `<div style="margin-bottom:34px;${flag?`transform:translateX(${Math.sin(u*70)*8*Math.exp(-(u-3.7)*3)}px)`:""}"><div style="display:flex;font:700 38px Inter;margin-bottom:12px"><span>${n}</span>${flag?`<span class="chip" style="font-size:26px;padding:4px 16px;margin-left:16px;background:#ef4444;color:#fff">Lỗi nghiêm trọng</span>`:""}<span style="margin-left:auto" class="mono">${(v*p).toFixed(0)}/${m}</span></div><div style="height:22px;border-radius:11px;background:rgba(120,140,200,.2);overflow:hidden"><i style="display:block;height:100%;width:${v/m*100*p}%;border-radius:11px;background:${flag?"linear-gradient(90deg,#fb7185,#ef4444)":"linear-gradient(90deg,#fbbf24,#f59e0b)"}"></i></div></div>`}).join("");
 const slam=back(seg(u,4.0,4.6));
 return `<div class="abs" style="left:0;right:0;top:170px;text-align:center;font:700 36px Inter;letter-spacing:6px;color:var(--mut);${rise(u,0,20)}">ĐIỂM ĐỀ XUẤT · DO MÃ LỆNH CỘNG</div>
 <div class="abs" style="left:0;right:0;top:250px;text-align:center;font:800 260px Inter;letter-spacing:-8px;line-height:1"><span class="gold mono">${Math.round(cum)}</span><span class="mut" style="font-size:90px;letter-spacing:0">/100</span></div>
 <div class="abs card" style="left:70px;top:640px;width:940px;padding:50px 56px 24px;${rise(u,.1,60)}">${rows}</div>

 return `<div class="abs" style="left:0;right:0;top:160px;text-align:center;${rise(u,0,20)}"><div class="mono" style="font:800 150px Inter;letter-spacing:-4px;color:${warm>.5?"#fbbf24":"#7fa6ff"};text-shadow:0 0 50px ${warm>.5?"rgba(251,191,36,.5)":"rgba(100,150,255,.5)"}">${clock}</div></div>

 <div class="abs" style="left:0;right:0;top:1590px;text-align:center;font:800 48px Inter;${rise(u,1.3,30)}">Gửi yêu cầu: <span class="gold">aaa.isavietnam.app</span></div>`}
const S=[s0,s1,s2,s3,s4,s5,s6,s7,s8,s9,s10];
window.draw=t=>{let i=0;while(i<TL.length-1&&t>=ST[i+1])i++;const u=t-ST[i];

 document.getElementById("sc").innerHTML=S[i](u,t);
 const showTop=t>13.2;document.getElementById("top").style.opacity=showTop?ease(seg(t,13.2,14)):0;document.getElementById("prem").style.opacity=showTop?ease(seg(t,13.2,14)):0;
 document.getElementById("top").style.color="var(--fg)";document.getElementById("foot").style.opacity=t<1?0:1;

 if(t>23&&t<23.7){const k=(23.7-t)/.7;ty=Math.sin(t*70)*10*k}if(t>31&&t<31.6){const k=(31.6-t)/.6;tx=Math.sin(t*80)*12*k}
 document.getElementById("cam").style.transform=`translate(${tx}px,${ty}px) scale(${sc})`}
